
name: Gulistan News Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Extract Fresh HDNEA Token
        run: |
          set -e

          SOURCE_URL="https://hjh-545.pages.dev/stream?id=gulistannews"

          curl --silent --show-error \
            --max-redirs 0 \
            --dump-header response_headers.txt \
            --output /dev/null \
            "$SOURCE_URL"

          python3 - <<'PY'
          import re
          import sys
          from urllib.parse import urljoin, urlparse, parse_qs

          source = "https://hjh-545.pages.dev/stream?id=gulistannews"

          with open("response_headers.txt", "r", encoding="utf-8") as f:
              headers = f.read()

          locations = re.findall(
              r"(?im)^Location:\s*(.*?)\s*$",
              headers
          )

          if not locations:
              sys.exit("ERROR: Redirect Location header not found")

          location = urljoin(source, locations[-1])
          query = parse_qs(urlparse(location).query)

          token = query.get("__hdnea__", [None])[0]

          if not token:
              sys.exit("ERROR: HDNEA token not found in redirect URL")

          if not re.fullmatch(r"[A-Za-z0-9_~=-]+", token):
              sys.exit("ERROR: Invalid token format")

          stream_url = (
              "https://jiotvmblive.cdn.jio.com/"
              "bpk-tv/Gulistan_News_MOB/WDVLive/index.mpd"
              "?__hdnea__=" + token
          )

          playlist = """#EXTINF:-1 tvg-id="807" group-title="JioStarTv" tvg-logo="https://jiotvimages.cdn.jio.com/dare_images/images/Gulistan_News.png",Gulistan News
          #KODIPROP:inputstream.adaptive.license_type=clearkey
          #KODIPROP:inputstream.adaptive.license_key=33bd380c97d252a0b9835fda391d395a:555d0da3a0dbd38d02b7ecc29d003e23
          #KODIPROP:inputstream.adaptive.manifest_type=mpd
          """ + stream_url + "\n"

          playlist = "\n".join(
              line.lstrip()
              for line in playlist.splitlines()
          ) + "\n"

          with open("Gulistan_News.m3u", "w", encoding="utf-8") as f:
              f.write(playlist)

          print("SUCCESS: Fresh Gulistan News token extracted")
          print("SUCCESS: Gulistan_News.m3u created")
          PY

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gulistan_News.m3u

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Create or update Gulistan News playlist"
          git push origin main

      - name: Cleanup
        if: always()
        run: rm -f response_headers.txt
