
      - name: Diagnose Source Redirect
        run: |
          set -e

          curl --silent --show-error \
            --max-redirs 0 \
            --dump-header response_headers.txt \
            --output /dev/null \
            "https://hjh-545.pages.dev/stream?id=gulistannews"

          python3 - <<'PY'
          import re
          from urllib.parse import urlparse

          with open("response_headers.txt", encoding="utf-8") as f:
              headers = f.read()

          status = re.findall(r"(?m)^HTTP/\S+\s+\d+", headers)
          locations = re.findall(
              r"(?im)^Location:\s*(.*?)\s*$",
              headers
          )

          print("HTTP STATUS:", status[-1] if status else "Not found")

          if not locations:
              print("LOCATION: Not found")
          else:
              location = locations[-1]
              parsed = urlparse(location)

              print("LOCATION HOST:", parsed.netloc)
              print("LOCATION PATH:", parsed.path)
              print("QUERY PARAMETER NAMES:", list(
                  dict.fromkeys(
                      key for key in
                      re.findall(r"(?:^|&)([^=&]+)=", parsed.query)
                  )
              ))

              print("HDNEA PRESENT:", "__hdnea__" in parsed.query)
          PY
