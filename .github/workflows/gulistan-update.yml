
name: Gulistan News Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch and Generate Gulistan M3U
        run: |
          node --input-type=module <<'JS'
          import fs from "node:fs";

          const sourceUrl =
            "https://hjh-545.pages.dev/stream?id=gulistannews";

          try {
            const response = await fetch(sourceUrl, {
              method: "GET",
              redirect: "manual",
              cache: "no-store",
              headers: {
                "User-Agent":
                  "OTT Navigator/1.7.2.2 (Linux;Android 11; en; 1nsjitl)",
                "Cache-Control": "no-cache",
                "Pragma": "no-cache"
              }
            });

            console.log("HTTP STATUS:", response.status);

            if (![301, 302, 303, 307, 308].includes(response.status)) {
              const body = await response.text();

              console.log("SOURCE RESPONSE:", body.slice(0, 500));

              throw new Error(
                `Expected redirect, received HTTP ${response.status}`
              );
            }

            const location = response.headers.get("location");

            if (!location) {
              throw new Error("Redirect Location header missing");
            }

            const redirectUrl = new URL(location, sourceUrl);

            const token =
              redirectUrl.searchParams.get("__hdnea__");

            if (!token) {
              console.log("LOCATION HOST:", redirectUrl.host);
              console.log("LOCATION PATH:", redirectUrl.pathname);
              console.log(
                "QUERY PARAMETERS:",
                [...redirectUrl.searchParams.keys()]
              );

              throw new Error(
                "HDNEA token not found in redirect Location"
              );
            }

            const streamUrl =
              "https://jiotvmblive.cdn.jio.com/" +
              "bpk-tv/Gulistan_News_MOB/WDVLive/index.mpd" +
              "?__hdnea__=" + token;

            const m3u = [
              '#EXTINF:-1 tvg-id="807" group-title="JioStarTv" tvg-logo="https://jiotvimages.cdn.jio.com/dare_images/images/Gulistan_News.png",Gulistan News',
              '#KODIPROP:inputstream.adaptive.license_type=clearkey',
              '#KODIPROP:inputstream.adaptive.license_key=33bd380c97d252a0b9835fda391d395a:555d0da3a0dbd38d02b7ecc29d003e23',
              '#KODIPROP:inputstream.adaptive.manifest_type=mpd',
              streamUrl
            ].join("\n") + "\n";

            fs.writeFileSync(
              "Gulistan_News.m3u",
              m3u,
              "utf8"
            );

            console.log("SUCCESS: Gulistan News M3U generated");
            console.log("TOKEN: Extracted successfully (hidden)");

          } catch (error) {
            console.error("ERROR:", error.message);
            process.exit(1);
          }
          JS

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gulistan_News.m3u

          if git diff --cached --quiet; then
            echo "No changes detected. Token may be unchanged."
            exit 0
          fi

          git commit -m "Auto update Gulistan News token"
          git push origin main
