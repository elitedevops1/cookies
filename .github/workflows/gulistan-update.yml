
name: Gulistan News Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download Latest Gulistan News M3U
        run: |
          set -e

          curl --fail --silent --show-error --location \
            --retry 3 \
            --retry-delay 5 \
            --output Gulistan_News.m3u \
            "https://token24x7.drizzzydanny-f45.workers.dev/"

          if ! grep -q "__hdnea__=" Gulistan_News.m3u; then
            echo "ERROR: Valid HDNEA token not found"
            exit 1
          fi

          if ! grep -q "Gulistan_News_MOB/WDVLive/index.mpd" Gulistan_News.m3u; then
            echo "ERROR: Gulistan News stream URL not found"
            exit 1
          fi

          echo "Gulistan News playlist downloaded successfully"
          cat Gulistan_News.m3u

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gulistan_News.m3u

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "Create or update Gulistan News playlist"
          git push origin main
