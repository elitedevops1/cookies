
name: Gulistan News Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Fetch Latest Gulistan Redirect
        run: |
          set -e

          SOURCE_URL="https://hjh-545.pages.dev/stream?id=gulistannews"

          curl --silent --show-error \
            --max-redirs 0 \
            --connect-timeout 20 \
            --max-time 40 \
            --dump-header response_headers.txt \
            --output /dev/null \
            --header "User-Agent: OTT Navigator/1.7.2.2 (Linux;Android 11; en; 1nsjitl)" \
            --header "Cache-Control: no-cache" \
            --header "Pragma: no-cache" \
            "$SOURCE_URL"

          echo "Source request completed"

      - name: Generate Gulistan News M3U
        run: |
          python3 - <<'PY'
          import re
          import sys
          from urllib.parse import urljoin, urlparse, parse_qs

          source_url = "https://hjh-545.pages.dev/stream?id=gulistannews"

          with open("response_headers.txt", "r", encoding="utf-8") as f:
              headers = f.read()

          blocks = re.split(r"\r?\n\r?\n", headers.strip())

          location = None
          status = None

          for block in blocks:
              lines = block.splitlines()

              if not lines:
                  continue

              match = re.match(r"HTTP/\S+\s+(\d+)", lines[0])

              if not match:
                  continue

              current_status = int(match.group(1))
              current_location = None

              for line in lines[1:]:
                  if line.lower().startswith("location:"):
                      current_location = line.split(":", 1)[1].strip()

              status = current_status
              location = current_location

          if status not in (301, 302, 303, 307, 308):
              sys.exit(
                  f"ERROR: Expected redirect, received HTTP {status}"
              )

          if not location:
              sys.exit("ERROR: Location header not found")

          redirect_url = urljoin(source_url, location)
          parsed_url = urlparse(redirect_url)

          token = parse_qs(
              parsed_url.query,
              keep_blank_values=True
          ).get("__hdnea__", [None])[0]

          if not token:
              sys.exit("ERROR: HDNEA token not found in Location URL")

          if not re.fullmatch(r"[A-Za-z0-9_~=-]+", token):
              sys.exit("ERROR: Invalid HDNEA token format")

          stream_url = (
              "https://jiotvmblive.cdn.jio.com/"
              "bpk-tv/Gulistan_News_MOB/WDVLive/index.mpd"
              "?__hdnea__=" + token
          )

          m3u = [
              '#EXTINF:-1 tvg-id="807" group-title="JioStarTv" tvg-logo="https://jiotvimages.cdn.jio.com/dare_images/images/Gulistan_News.png",Gulistan News',
              '#KODIPROP:inputstream.adaptive.license_type=clearkey',
              '#KODIPROP:inputstream.adaptive.license_key=33bd380c97d252a0b9835fda391d395a:555d0da3a0dbd38d02b7ecc29d003e23',
              '#KODIPROP:inputstream.adaptive.manifest_type=mpd',
              stream_url
          ]

          with open("Gulistan_News.m3u", "w", encoding="utf-8") as f:
              f.write("\n".join(m3u) + "\n")

          print("SUCCESS: Fresh HDNEA token extracted")
          print("SUCCESS: Gulistan_News.m3u generated")
          print("Token is not displayed for security.")
          PY

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Gulistan_News.m3u

          if git diff --cached --quiet; then
            echo "No changes detected. Token may be unchanged."
            exit 0
          fi

          git commit -m "Auto update Gulistan News token"
          git push origin main

      - name: Cleanup
        if: always()
        run: rm -f response_headers.txt
