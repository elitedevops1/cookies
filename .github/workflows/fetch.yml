name: Extract MPD Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch MPD
        run: |
          mkdir -p output

          curl -L \
            -A "OTT Navigator/1.7.2.2 (Linux; Android 11; en; 1nsjitl)" \
            -D output/headers.txt \
            -o output/678.mpd \
            "https://vortexsu.azmodz.in/vortextv/serve/jionormal/678.mpd"

      - name: Save Response Info
        run: |
          {
            echo "=== Download Time ==="
            date -u
            echo
            echo "=== SHA256 ==="
            sha256sum output/678.mpd
            echo
            echo "=== File Size ==="
            wc -c output/678.mpd
          } > output/info.txt

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update MPD files"
            git push
          fi
