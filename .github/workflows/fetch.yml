
name: Download M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download Playlist
        run: |
          set -euo pipefail

          echo "Downloading playlist..."

          curl --fail-with-body \
            --location \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 120 \
            "https://zeotvyash.streamxlivenow.workers.dev/" \
            -o kashmiri

          if [ ! -s kashmiri ]; then
            echo "ERROR: Playlist is empty!"
            exit 1
          fi

          if ! head -n 1 kashmiri | grep -q '#EXTM3U'; then
            echo "ERROR: Invalid M3U playlist!"
            exit 1
          fi

          echo "Playlist downloaded successfully."
          echo "File size: $(wc -c < kashmiri) bytes"

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kashmiri

          if git diff --cached --quiet; then
            echo "No playlist changes detected."
          else
            git commit -m "Updated playlist"
            git push
            echo "Playlist updated successfully!"
          fi
